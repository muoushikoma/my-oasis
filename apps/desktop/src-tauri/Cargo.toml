[package]
name = "my-oasis-desktop"
version = "0.1.1"
edition = "2021"
description = "我的绿洲 单机客户端"

[lib]
name = "my_oasis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.6", features = [] }
tauri-plugin-dialog = "~2.7.3"
tauri-plugin-opener = "~2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
oasis-native = { path = "../../../crates/oasis-native", features = ["keychain"] }
