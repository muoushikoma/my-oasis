<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的绿洲 · My Oasis</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f5;--fg:#1d2420;--muted:#66706a;--card:#fff;--line:#dfe3df;--acc:#2f7d5b}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--fg:#e8ece9;--muted:#9aa49e;--card:#1d2320;--line:#2c3430;--acc:#5fbf8f}}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg)}
header{padding:28px 20px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.wrap{max-width:1040px;margin:0 auto}h1{margin:0 0 4px;font-size:26px}.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
a.btn,button{display:inline-block;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none;font:inherit;cursor:pointer}
a.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
select{padding:6px;border-radius:6px;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line)}
main{padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:16/9;background:#2f7d5b22;display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--acc)}
.cover img{width:100%;height:100%;object-fit:cover}.body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.body h3{margin:0;font-size:17px}.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-right:4px}
.empty{text-align:center;padding:60px 10px}footer{text-align:center;padding:24px;font-size:13px}
</style></head><body>
<header><div class="wrap">
 <div class="row"><div class="sp"><h1 data-t="title"></h1><div class="muted" data-t="tagline"></div></div>
  <select id="lang"><option value="zh">简体中文</option><option value="en">English</option><option value="ja">日本語</option></select></div>
 <div class="row" style="margin-top:14px">
  <a class="btn pri" href="https://github.com/muoushikoma/my-oasis/releases/latest" data-t="dl"></a>
  <a class="btn" href="https://github.com/muoushikoma/my-oasis#readme" data-t="submit"></a>
  <a class="btn" href="https://github.com/muoushikoma/my-oasis" data-t="src"></a></div>
</div></header>
<main class="wrap"><div id="list"></div></main>
<footer class="muted wrap" data-t="foot"></footer>
<script>
const T={zh:{title:"我的绿洲",tagline:"AI 驱动的冒险故事 · 规则由作者决定",dl:"下载客户端（Windows / 安卓）",submit:"如何投稿",src:"源代码（开源）",empty:"暂无故事，欢迎投稿！",get:"下载 .oasis",by:"作者",ai:"需要 AI",noai:"纯规则",rating:{"all-ages":"全年龄",teen:"青少年"},foot:"非盈利开源项目。故事版权归各自作者所有。下载 .oasis 后在客户端「游玩 → 导入」打开。",load:"加载中…",err:"读取故事目录失败"},
en:{title:"My Oasis",tagline:"AI-driven adventure stories · rules set by authors",dl:"Download the app (Windows / Android)",submit:"How to submit",src:"Source code",empty:"No stories yet — submissions welcome!",get:"Download .oasis",by:"by",ai:"Needs AI",noai:"Rules only",rating:{"all-ages":"All ages",teen:"Teen"},foot:"A non-profit open-source project. Stories are copyright of their authors. Open a downloaded .oasis via Play → Import in the app.",load:"Loading…",err:"Failed to load the story index"},
ja:{title:"マイ・オアシス",tagline:"AI が紡ぐ冒険物語 · ルールは作者が決める",dl:"クライアントをダウンロード（Windows / Android）",submit:"投稿方法",src:"ソースコード",empty:"まだ物語はありません。投稿をお待ちしています！",get:".oasis をダウンロード",by:"作者",ai:"AI 必要",noai:"ルールのみ",rating:{"all-ages":"全年齢",teen:"ティーン"},foot:"非営利のオープンソースプロジェクトです。物語の著作権は各作者に帰属します。",load:"読み込み中…",err:"物語一覧の読み込みに失敗しました"}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lang=localStorage.lang||(navigator.language.startsWith("ja")?"ja":navigator.language.startsWith("zh")?"zh":"en"),idx=null;
const sel=document.getElementById("lang");sel.value=lang;sel.onchange=()=>{lang=localStorage.lang=sel.value;draw()};
function draw(){const t=T[lang];document.documentElement.lang=lang==="zh"?"zh-CN":lang;document.title=t.title+" · My Oasis";
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);const L=document.getElementById("list");
 if(!idx){L.innerHTML=`<p class="muted">${t.load}</p>`;return}
 if(idx.error){L.innerHTML=`<p class="empty muted">${t.err}</p>`;return}
 if(!idx.stories.length){L.innerHTML=`<p class="empty muted">${t.empty}</p>`;return}
 L.innerHTML='<div class="grid">'+idx.stories.map(s=>`<div class="card"><div class="cover">${s.cover?`<img loading="lazy" src="${esc(s.cover)}" alt="">`:esc((s.title||"?").slice(0,1))}</div><div class="body"><h3>${esc(s.title)}</h3><div><span class="tag">${esc(t.rating[s.rating]||s.rating||"")}</span><span class="tag">${s.ai?t.ai:t.noai}</span></div><div class="muted">${esc(s.summary)}</div><div class="muted" style="font-size:13px">${t.by} ${esc(s.author||"—")} · v${esc(s.version)}</div><div class="sp"></div><a class="btn pri" href="${esc(s.download)}" download>${t.get}</a></div></div>`).join("")+"</div>"}
draw();fetch("index.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{idx=j;draw()}).catch(()=>{idx={error:1};draw()});
</script></body></html>
