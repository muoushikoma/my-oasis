# Windows 安装包构建（手动触发、打 v* 标签，或改了代码的 PR；只改故事的 PR 不触发）
name: windows-build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore: ["stories/**", "site/**", "tools/stories/**", "**/*.md"]
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      # Rust 编译缓存：Cargo 工作区在仓库根目录（src-tauri 是其成员，产物在 ./target）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: windows
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Rust 单元测试（含钥匙串之外的本地逻辑）
        run: cargo test -p oasis-native
      - name: 构建安装包（NSIS + MSI）
        working-directory: apps/desktop
        env:
          # GitHub 登录应用的 Client ID（公开信息，放在仓库 Variables 里，不是 Secret）
          OASIS_GITHUB_CLIENT_ID: ${{ vars.OASIS_GITHUB_CLIENT_ID }}
        run: pnpm tauri build
      # 试水阶段没有代码签名证书，安装时 Windows 会有 SmartScreen 提示
      - uses: actions/upload-artifact@v4
        with:
          name: my-oasis-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  release:
    # 打 v* 标签时把安装包上传到同名 Release（不存在就建一个草稿；已存在就覆盖同名文件）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          VER="${TAG#v}"
          mkdir -p up && find dist -name "*.exe" -o -name "*.msi" | xargs -I{} cp {} up/
          ls -la up
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || gh release create "$TAG" -R "$REPO" --draft --verify-tag --title "我的绿洲 $TAG" --notes "见 CHANGELOG.md 的 $VER 一节。" || { sleep 20; gh release view "$TAG" -R "$REPO" >/dev/null; }
          gh release upload "$TAG" up/* -R "$REPO" --clobber
