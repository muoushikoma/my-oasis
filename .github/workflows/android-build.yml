# 安卓 APK 构建（手动触发、打 v* 标签，或改了代码的 PR；只改故事的 PR 不触发）。不提交任何签名密钥：
# - 默认每次用临时生成的自签名证书签名（能安装；但换证书后需先卸载旧版才能装新版）
# - 以后想要固定签名：在仓库 Secrets 里放 ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD（keystore 别名 my-oasis）
name: android-build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore: ["stories/**", "site/**", "tools/stories/**", "**/*.md"]
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      # Tauri 2.11 生成的安卓工程用 AGP 8.11 + Gradle 8.14，需要 JDK 17 及以上
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # 用 runner 自带的 Android SDK（不再用 setup-android），只补装需要的组件：
      # compileSdk/targetSdk 36、AGP 8.11 默认的 build-tools 35、NDK r27c
      - name: 安装 SDK 组件并设置 NDK_HOME
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "SDK=$SDK  sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$SDK/build-tools/35.0.0" >> "$GITHUB_ENV"
          ls "$SDK/ndk/27.2.12479018/toolchains/llvm/prebuilt"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: pnpm install --frozen-lockfile
      # 安卓工程（src-tauri/gen/android）不进仓库，每次在 CI 里生成
      - name: 生成安卓工程
        working-directory: apps/desktop
        run: pnpm tauri android init --ci
      - name: 构建 APK（release，未签名）
        working-directory: apps/desktop
        env:
          OASIS_GITHUB_CLIENT_ID: ${{ vars.OASIS_GITHUB_CLIENT_ID }}
        run: pnpm tauri android build --ci --apk --target aarch64 --target armv7 --target x86_64
      - name: 签名（不提交密钥）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          IN=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*release-unsigned.apk" | head -1)
          if [ -z "$IN" ]; then echo "找不到 APK，产物如下："; find apps/desktop/src-tauri/gen/android/app/build/outputs -name "*.apk"; exit 1; fi
          echo "APK: $IN"
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"; PASS="$KS_PASS";
          else PASS=$(openssl rand -hex 16); keytool -genkeypair -keystore "$RUNNER_TEMP/ks.jks" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias my-oasis -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=My Oasis Test"; fi
          "$BUILD_TOOLS/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias my-oasis --out my-oasis-android.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify my-oasis-android.apk
          rm -f "$RUNNER_TEMP/ks.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: my-oasis-android
          path: my-oasis-android.apk
          if-no-files-found: error
          retention-days: 14
