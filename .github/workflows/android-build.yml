# 安卓 APK 构建（手动触发、打 v* 标签，或改了代码的 PR；只改故事的 PR 不触发）。不提交任何签名密钥：
# - 默认每次用临时生成的自签名证书签名（能安装；但换证书后需先卸载旧版才能装新版）
# - 仓库 Secrets 里有正式证书（ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS）时用正式证书签名，
#   以后更新可直接覆盖安装；fork 来的 PR 拿不到 Secrets，自动退回临时证书。
name: android-build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore: ["stories/**", "site/**", "tools/stories/**", "**/*.md"]
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      # Tauri 2.11 生成的安卓工程用 AGP 8.11 + Gradle 8.14，需要 JDK 17 及以上
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # 用 runner 自带的 Android SDK（不再用 setup-android），只补装需要的组件：
      # compileSdk/targetSdk 36、AGP 8.11 默认的 build-tools 35、NDK r27c
      - name: 找到 SDK 并设置环境变量
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$SDK/build-tools/35.0.0" >> "$GITHUB_ENV"
      # 缓存装好的 SDK 组件（key 含版本号；改版本就自动换新缓存）
      - name: 缓存 Android SDK 组件与 NDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDK }}/platforms/android-36
            ${{ env.SDK }}/build-tools/35.0.0
            ${{ env.SDK }}/ndk/27.2.12479018
          key: android-sdk-platforms36-bt35.0.0-ndk27.2.12479018-${{ runner.os }}
      - name: 安装 SDK 组件（缓存命中则跳过）
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null
      - name: 检查 SDK 组件
        run: ls "$NDK_HOME/toolchains/llvm/prebuilt" "$BUILD_TOOLS/apksigner" "$SDK/platforms/android-36/android.jar"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # Rust 编译缓存：Cargo 工作区在仓库根目录（src-tauri 是其成员，产物统一在 ./target，含各安卓 target 子目录）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: android
          cache-on-failure: true
      # Gradle 依赖与构建缓存
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      # 安卓工程（src-tauri/gen/android）不进仓库，每次在 CI 里生成
      - name: 生成安卓工程
        working-directory: apps/desktop
        run: pnpm tauri android init --ci
      # 换上我们的 MainActivity：沉浸全屏 + 返回键打开暂停菜单（故事接管页面时用）
      - name: 安装安卓壳 MainActivity
        working-directory: apps/desktop
        run: |
          F=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt | head -1)
          if [ -z "$F" ]; then echo "找不到生成的 MainActivity.kt"; exit 1; fi
          cp android/MainActivity.kt "$F"
      # 故事能用的设备功能：振动（api.device.vibrate，普通权限，不弹窗）；软键盘弹出时页面缩小，输入框不被挡住
      - name: 安卓清单：振动权限、软键盘
        working-directory: apps/desktop
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' "$M"
          grep -q 'windowSoftInputMode' "$M" || sed -i '0,/<activity /s#<activity #<activity android:windowSoftInputMode="adjustResize" #' "$M"
          grep -n 'VIBRATE\|windowSoftInputMode' "$M"
      - name: 构建 APK（release，未签名）
        working-directory: apps/desktop
        env:
          OASIS_GITHUB_CLIENT_ID: ${{ vars.OASIS_GITHUB_CLIENT_ID }}
        run: pnpm tauri android build --ci --apk --target aarch64 --target armv7 --target x86_64
      - name: 签名（有正式证书用正式证书，否则用临时证书；不打印密码）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          IN=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*release-unsigned.apk" | head -1)
          if [ -z "$IN" ]; then echo "找不到 APK，产物如下："; find apps/desktop/src-tauri/gen/android/app/build/outputs -name "*.apk"; exit 1; fi
          echo "APK: $IN"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "使用正式证书（release keystore）签名"
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            PASS="$KS_PASS"; KPASS="${KEY_PASS:-$KS_PASS}"; ALIAS="${KEY_ALIAS:-my-oasis}"
          else
            echo "::warning::没有正式证书（例如 fork 的 PR），使用临时自签名证书"
            PASS=$(openssl rand -hex 16); KPASS="$PASS"; ALIAS=my-oasis; echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.jks" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias my-oasis -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=My Oasis Test" > /dev/null
          fi
          export PASS KPASS
          "$BUILD_TOOLS/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass env:PASS --key-pass env:KPASS --ks-key-alias "$ALIAS" --out my-oasis-android.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/ks.jks"
          "$BUILD_TOOLS/apksigner" verify --print-certs my-oasis-android.apk | grep -i 'SHA-256' || true
      - uses: actions/upload-artifact@v4
        with:
          name: my-oasis-android
          path: my-oasis-android.apk
          if-no-files-found: error
          retention-days: 14
