spec: oasis/0.4
meta:
  id: endless-road
  title: { zh: 无尽之路, en: The Endless Road }
  version: 1.0.0
  summary:
    zh: 一条没有尽头的路，一路上的怪物、陷阱、行商与奇遇都由 AI 现场生成（需要接入 AI）。简化版 D&D 规则，管好资源、强化装备，看你能走多远。
    en: An endless road where AI invents every monster, trap and wonder (AI required). Light D&D rules — manage supplies, upgrade gear, see how far you get.
  language: zh-CN
  languages: [zh, en]
  rating: all-ages
  tags:
    - { zh: 地下城与勇士规则, en: D&D rules }
    - { zh: 无尽生存, en: Survival }
    - { zh: AI生成事件, en: AI events }
  authors: [muoushikoma]
  cover: assets/cover.png
  est_minutes: 30
  license: All rights reserved by the author; distributed under stories/LICENSE.md

assets:
  cover: { type: image, path: assets/cover.png, use: illustration, alt: { zh: 通往远方的路, en: A road to the horizon } }
  vista: { type: image, path: assets/vista.png, use: illustration, alt: { zh: 远方的风景, en: A distant view } }
  # 背景：每个地区 4 层（天空 / 远景 / 中景 / 地面与路），画面里按不同速度视差卷动
  plains_sky: { type: image, path: assets/bg/plains_sky.png, use: background }
  plains_far: { type: image, path: assets/bg/plains_far.png, use: background }
  plains_mid: { type: image, path: assets/bg/plains_mid.png, use: background }
  plains_ground: { type: image, path: assets/bg/plains_ground.png, use: background }
  forest_sky: { type: image, path: assets/bg/forest_sky.png, use: background }
  forest_far: { type: image, path: assets/bg/forest_far.png, use: background }
  forest_mid: { type: image, path: assets/bg/forest_mid.png, use: background }
  forest_ground: { type: image, path: assets/bg/forest_ground.png, use: background }
  hills_sky: { type: image, path: assets/bg/hills_sky.png, use: background }
  hills_far: { type: image, path: assets/bg/hills_far.png, use: background }
  hills_mid: { type: image, path: assets/bg/hills_mid.png, use: background }
  hills_ground: { type: image, path: assets/bg/hills_ground.png, use: background }
  swamp_sky: { type: image, path: assets/bg/swamp_sky.png, use: background }
  swamp_far: { type: image, path: assets/bg/swamp_far.png, use: background }
  swamp_mid: { type: image, path: assets/bg/swamp_mid.png, use: background }
  swamp_ground: { type: image, path: assets/bg/swamp_ground.png, use: background }
  mountains_sky: { type: image, path: assets/bg/mountains_sky.png, use: background }
  mountains_far: { type: image, path: assets/bg/mountains_far.png, use: background }
  mountains_mid: { type: image, path: assets/bg/mountains_mid.png, use: background }
  mountains_ground: { type: image, path: assets/bg/mountains_ground.png, use: background }
  ashlands_sky: { type: image, path: assets/bg/ashlands_sky.png, use: background }
  ashlands_far: { type: image, path: assets/bg/ashlands_far.png, use: background }
  ashlands_mid: { type: image, path: assets/bg/ashlands_mid.png, use: background }
  ashlands_ground: { type: image, path: assets/bg/ashlands_ground.png, use: background }
  # 精灵（像素画，自动描边）：主角 6 帧（站立、走路 4 帧、攻击），篝火 2 帧，其余 1 帧
  hero: { type: image, path: assets/sprites/hero.png, use: other }
  wolf: { type: image, path: assets/sprites/wolf.png, use: other }
  spider: { type: image, path: assets/sprites/spider.png, use: other }
  bandit: { type: image, path: assets/sprites/bandit.png, use: other }
  skeleton: { type: image, path: assets/sprites/skeleton.png, use: other }
  troll: { type: image, path: assets/sprites/troll.png, use: other }
  drake: { type: image, path: assets/sprites/drake.png, use: other }
  ooze: { type: image, path: assets/sprites/ooze.png, use: other }
  wisp: { type: image, path: assets/sprites/wisp.png, use: other }
  warden: { type: image, path: assets/sprites/warden.png, use: other }
  chest: { type: image, path: assets/sprites/chest.png, use: other }
  cart: { type: image, path: assets/sprites/cart.png, use: other }
  shrine: { type: image, path: assets/sprites/shrine.png, use: other }
  campfire: { type: image, path: assets/sprites/campfire.png, use: other }
  stranger: { type: image, path: assets/sprites/stranger.png, use: other }
  rocks: { type: image, path: assets/sprites/rocks.png, use: other }
  chasm: { type: image, path: assets/sprites/chasm.png, use: other }
  thorns: { type: image, path: assets/sprites/thorns.png, use: other }

state:
  hp:        { type: number, init: 14, min: 0, integer: true, label: { zh: 生命, en: HP } }
  max_hp:    { type: number, init: 14, min: 1, integer: true, label: { zh: 最大生命, en: Max HP } }
  level:     { type: number, init: 1, min: 1, integer: true, label: { zh: 等级, en: Level } }
  xp:        { type: number, init: 0, min: 0, integer: true, label: { zh: 经验, en: XP } }
  xp_next:   { type: number, init: 60, integer: true, label: { zh: 升级所需, en: XP to level } }
  ac:        { type: number, init: 12, integer: true, label: { zh: 护甲等级, en: Armor Class } }
  distance:  { type: number, init: 0, min: 0, integer: true, label: { zh: 已走里程, en: Miles walked } }
  best:      { type: number, init: 0, min: 0, integer: true, label: { zh: 最远纪录, en: Best record } }
  kills:     { type: number, init: 0, min: 0, integer: true, label: { zh: 击败敌人, en: Foes defeated } }
  # 资源
  rations:   { type: number, init: 8, min: 0, integer: true, visible: ai, desc: 口粮，每里吃 1 份 }
  potions:   { type: number, init: 2, min: 0, integer: true, visible: ai, desc: 治疗药水 }
  gold:      { type: number, init: 15, min: 0, integer: true, visible: ai, desc: 金币 }
  iron:      { type: number, init: 0, min: 0, integer: true, visible: ai, desc: 铁料（强化材料） }
  essence:   { type: number, init: 0, min: 0, integer: true, visible: ai, desc: 魔晶（稀有强化材料） }
  gear:      { type: json, init: { weapon: 0, armor: 0, pack: 0, kit: 0 }, visible: ai, desc: 强化等级：武器、护甲、背包、营具 }
  relics:    { type: json, init: [], visible: ai, desc: 携带的遗物（最多 3 件） }
  status:    { type: json, init: {}, visible: ai, desc: 状态效果及剩余里程 }
  quest:     { type: json, init: {}, visible: ai, desc: 进行中的委托（title 名字，due 回访的里程） }
  # 冒险者
  abil:      { type: json, init: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 }, visible: ai, desc: 冒险者的六项属性值 }
  abilities: { type: string, init: "", visible: player, label: { zh: 属性, en: Abilities } }
  # 世界
  biome:
    type: enum
    values: [plains, forest, hills, swamp, mountains, ashlands]
    init: plains
    visible: ai
    desc: 当前地区：plains 风语平原，forest 幽暗森林，hills 古冢丘陵，swamp 腐沼泽地，mountains 霜脊山道，ashlands 余烬荒原
  art:       { type: json, init: { time: day, weather: clear }, visible: ai, desc: 画面的时间与天气 }
  scene_fx:  { type: json, init: { scroll: 0, target: 0, prev: null, cur: null, fx: [], busy: false }, visible: none, desc: 画面动画状态 }
  # 事件
  phase:
    type: enum
    values: [none, card, battle, shop]
    init: none
    visible: ai
    desc: 当前阶段：none 赶路，card 事件卡，battle 战斗，shop 交易
  event_kind:
    type: enum
    values: [none, combat, encounter, discovery, hazard, mystic, dilemma, trade, rest, quest]
    init: none
    visible: ai
    desc: 当前事件类别（由引擎掷骰决定）
  event_tier:
    type: enum
    values: [weak, normal, tough, elite, boss]
    init: normal
    visible: ai
    desc: 事件强度（由引擎掷骰决定）
  event_title: { type: string, init: "", max_length: 60, visible: ai, desc: 当前事件的名字 }
  threat:    { type: number, init: 1, integer: true, visible: ai, desc: 威胁等级，越大越危险 }
  card:      { type: json, init: {}, visible: none }
  foe:       { type: json, init: {}, visible: none }
  next_kind: { type: string, init: "", visible: none }
  camped:    { type: bool, init: false, visible: none }
  # 面板文字（规则生成）
  situation:   { type: string, init: "", visible: player, label: { zh: 眼前, en: Right now } }
  pack_text:   { type: string, init: "", visible: player, label: { zh: 行囊, en: Pack } }
  gear_text:   { type: string, init: "", visible: player, label: { zh: 强化, en: Upgrades } }
  relic_text:  { type: string, init: "", visible: player, label: { zh: 遗物, en: Relics } }
  status_text: { type: string, init: "", visible: player, label: { zh: 状态, en: Status } }

realtime:
  tick_hz: 20
  tick_ms: 16
  interpolate: true
  on_tick: scripts/scene.js#tick
  on_ui: scripts/road.js#on_ui
  on_resize: scripts/road.js#resize
  timers:
    card_watch: { every_ms: 500, script: scripts/road.js#watch }

start:
  intro:
    zh: 老旅店的门在你身后关上。门前那条路向东延伸，没人知道它通向哪里——据说从没有人走到过尽头。你紧了紧背包，迈出了第一步。
    en: The old inn's door shuts behind you. The road outside runs east, and no one knows where it leads — they say no one has ever reached its end. You tighten your pack and take the first step.
  do:
    - call: setup

actions:
  setup:
    callable_by: [rules]
    script: scripts/road.js#setup
  walk:
    label: { zh: 继续前进, en: Walk on }
    desc: { zh: 向前走一里，吃掉 1 份口粮，并遇到新的事件, en: "Walk one mile, eat 1 ration, and meet a new event" }
    require: "state.phase == 'none'"
    require_message: { zh: 先处理眼前的事件。, en: Deal with the current event first. }
    callable_by: [player]
    steps:
      - call: walk_rules
      - if: "state.phase == 'card'"
        then: [ { emit: encounter } ]
      - if: "state.distance % 10 == 0"
        then: [ { emit: milestone } ]
  walk_rules:
    callable_by: [rules]
    script: scripts/road.js#walk_rules
  attack:
    label: { zh: 攻击, en: Attack }
    require: "state.phase == 'battle'"
    require_message: { zh: 现在没有在战斗。, en: You are not in a fight. }
    callable_by: [player]
    script: scripts/road.js#attack
  flee:
    label: { zh: 逃跑, en: Flee }
    require: "state.phase == 'battle'"
    require_message: { zh: 现在没有在战斗。, en: You are not in a fight. }
    callable_by: [player]
    script: scripts/road.js#flee
  potion:
    label: { zh: 喝药水, en: Drink potion }
    require: "state.potions > 0 && state.hp < state.max_hp"
    require_message: { zh: 没有药水，或者生命已满。, en: "No potions, or you are at full HP." }
    callable_by: [player]
    script: scripts/road.js#potion
  camp:
    label: { zh: 扎营休息, en: Make camp }
    require: "state.phase == 'none' && !state.camped && state.rations > 0"
    require_message: { zh: 现在不能扎营（每里只能扎营一次，需要 1 份口粮，且附近不能有事件）。, en: "You can't camp now (once per mile, costs 1 ration, and nothing else going on)." }
    callable_by: [player]
    script: scripts/road.js#camp_rules
  apply_ai:
    callable_by: [rules]
    params:
      title:   { type: string, required: false }
      text:    { type: string, required: false }
      foe:     { type: string, required: false }
      relic:   { type: string, required: false }
      sprite:  { type: string, required: false }
      tint:    { type: string, required: false }
      time:    { type: string, required: false }
      weather: { type: string, required: false }
      o1_label: { type: string, required: false }
      o1_verb: { type: string, required: false }
      o1_ability: { type: string, required: false }
      o1_diff: { type: string, required: false }
      o1_reward: { type: string, required: false }
      o1_risk: { type: string, required: false }
      o1_cost: { type: string, required: false }
      o2_label: { type: string, required: false }
      o2_verb: { type: string, required: false }
      o2_ability: { type: string, required: false }
      o2_diff: { type: string, required: false }
      o2_reward: { type: string, required: false }
      o2_risk: { type: string, required: false }
      o2_cost: { type: string, required: false }
      o3_label: { type: string, required: false }
      o3_verb: { type: string, required: false }
      o3_ability: { type: string, required: false }
      o3_diff: { type: string, required: false }
      o3_reward: { type: string, required: false }
      o3_risk: { type: string, required: false }
      o3_cost: { type: string, required: false }
    script: scripts/road.js#apply_ai

endings:
  list:
    - id: fallen
      label: { zh: 倒在路上, en: Fallen on the road }
      kind: bad
      when: "state.hp <= 0"
      text:
        zh: 你倒在了路边。风吹过，路依旧向前延伸。看看你走了多远——下一次，也许能走得更远。
        en: You collapse by the roadside. The wind blows on, and the road still runs ahead. See how far you came — next time, perhaps further.


ai:
  model_hint: { tier: standard, note: 每走一里写一张事件卡（JSON），中等模型效果最好 }
  system: |
    这是一个低魔奇幻世界（类似 D&D 的经典奇幻）。一位冒险者沿着一条没有尽头的路向东走。
    风格：简洁、有画面感、偶尔带一点幽默。适合所有年龄：可以有战斗和危险，但不写血腥细节。
    每次冒险都应该是全新的：多用意想不到的生物、人物、地点和两难选择，不要重复之前出现过的东西。
  rules:
    max_authority: 0
    must:
      - 事件的类别和强度已经由引擎掷骰决定，你负责把它写成一张具体、生动的事件卡
      - 选项的收获和风险只能从给定的菜单里挑，具体数值由规则计算
    forbid:
      - 写出具体的数值、伤害或骰子结果
      - 替玩家做决定或写出事件的结果
      - 血腥、恐怖猎奇或不适合全年龄的内容
  entry_points:
    road_event:
      kind: generate
      trigger: event:encounter
      prompt: |
        冒险者走到了第 {{state.distance}} 里，地区：{{state.biome}}。
        引擎掷出的事件类别：{{state.event_kind}}，强度：{{state.event_tier}}，威胁等级：{{state.threat}}。
        冒险者：{{state.level}} 级，生命 {{state.hp}}/{{state.max_hp}}，属性 {{state.abil}}；口粮 {{state.rations}}，药水 {{state.potions}}，金币 {{state.gold}}，铁料 {{state.iron}}，魔晶 {{state.essence}}；遗物 {{state.relics}}；状态 {{state.status}}；委托 {{state.quest}}。

        请把这个事件写成一张事件卡：
        - title：事件名（不超过 12 个字）。text：2~3 句描述，停在需要做决定的地方。
        - foe：combat 时是敌人的名字（守关者要有气势的名号）；其他类别里如果有可能打起来的对象，写它的名字，否则留空。
        - 写 2~3 个选项（o1_ / o2_ / o3_），每个选项：
          - label：玩家要做的事（不超过 10 个字，如“攀过断桥”“说服守卫”“献上金币”）。
          - verb：check 属性检定 / pay 付出代价换确定收获 / gamble 赌运气 / fight 动手 / quest 接受委托（几里后回访，奖励丰厚）；不用的选项填 none。
          - ability（check 用）：str 力量、dex 敏捷、con 体质、int 智力、wis 感知、cha 魅力。diff（check 用）：easy / normal / hard，越难收获越大。
          - reward：成功时的收获 gold 金币 / rations 口粮 / potion 药水 / heal 恢复 / iron 铁料 / essence 魔晶 / xp 经验 / blessing 祝福 / relic 遗物（只有 hard 检定和委托回访才给）/ map 侦察 / none。
          - risk（check、gamble 用）：失败时 hurt 受伤 / lose_gold / lose_rations / curse 诅咒 / poison 中毒 / ambush 被袭击（转入战斗）/ lost 迷路 / exhaust 疲惫 / none。
          - cost（pay 用）：gold / rations / potion / hp / iron / essence。
        - 各类别的写法：
          - combat：遭遇一个敌人，至少一个 fight 选项，另外可以有偷偷绕过（check）、贿赂（pay）等。
          - encounter：遇到会说话的人或生物，可以交易、帮忙、接委托，也可能翻脸。
          - discovery：废墟、遗物、尸骸、宝箱。hazard：环境险阻（桥、风暴、流沙、落石）。
          - mystic：祭坛、精灵、诅咒之物、许愿泉。dilemma：两难的道德选择，让每个选项都有代价。
          - quest：委托（{{state.quest}}）的结局，要呼应委托的名字，奖励可以给 relic。
          - trade：写一位有特点的行商（选项留空，规则会打开商店）。rest：写一处安全的歇脚地（选项留空）。
        - 选项要有不同的取舍：比如一个稳妥但收获小，一个冒险但收获大，一个花资源换确定结果。结合冒险者当前缺什么来设计。
        - relic（可选）：如果有选项给 relic，挑一件：lucky_charm 幸运符、vampiric_blade 吸血之刃、traveler_boots 旅人靴、guardian_amulet 守护护符、hunter_horn 猎人号角、alchemist_flask 炼金瓶、star_chart 星图、undying_ember 不灭余烬。

        画面由模块拼成，请挑最贴切的组合：
        - sprite：combat 从 wolf 野兽、spider 虫、bandit 人形、skeleton 亡灵、troll 大块头、drake 飞龙、ooze 软泥、wisp 元素/幽魂 里选（守关者还可选 warden）；encounter/dilemma/quest 选 stranger、bandit、skeleton、wisp；discovery 选 chest、rocks、shrine；hazard 选 chasm、rocks、thorns；mystic 选 shrine、wisp；trade 选 cart；rest 选 campfire。
        - tint：none / red / green / blue / gold / shadow / pale / purple。time：day / dusk / night。weather：clear / rain / snow / fog / embers / fireflies / leaves，要符合地区。
      card:
        task: 把引擎刚刚掷出的路上事件写成一张事件卡：名字、描述、2~3 个有取舍的选项，以及画面模块。
        authority: 0
        output:
          format: json
          to: none
          max_chars: 1600
          schema:
            title: string
            text: string
            foe: string
            relic: "enum:[none,lucky_charm,vampiric_blade,traveler_boots,guardian_amulet,hunter_horn,alchemist_flask,star_chart,undying_ember]"
            o1_label: string
            o1_verb: "enum:[none,check,pay,gamble,fight,quest]"
            o1_ability: "enum:[wis,str,dex,con,int,cha]"
            o1_diff: "enum:[normal,easy,hard]"
            o1_reward: "enum:[none,gold,rations,potion,heal,iron,essence,xp,blessing,relic,map]"
            o1_risk: "enum:[hurt,lose_gold,lose_rations,curse,poison,ambush,lost,exhaust,none]"
            o1_cost: "enum:[gold,rations,potion,hp,iron,essence]"
            o2_label: string
            o2_verb: "enum:[none,check,pay,gamble,fight,quest]"
            o2_ability: "enum:[wis,str,dex,con,int,cha]"
            o2_diff: "enum:[normal,easy,hard]"
            o2_reward: "enum:[none,gold,rations,potion,heal,iron,essence,xp,blessing,relic,map]"
            o2_risk: "enum:[hurt,lose_gold,lose_rations,curse,poison,ambush,lost,exhaust,none]"
            o2_cost: "enum:[gold,rations,potion,hp,iron,essence]"
            o3_label: string
            o3_verb: "enum:[none,check,pay,gamble,fight,quest]"
            o3_ability: "enum:[wis,str,dex,con,int,cha]"
            o3_diff: "enum:[normal,easy,hard]"
            o3_reward: "enum:[none,gold,rations,potion,heal,iron,essence,xp,blessing,relic,map]"
            o3_risk: "enum:[hurt,lose_gold,lose_rations,curse,poison,ambush,lost,exhaust,none]"
            o3_cost: "enum:[gold,rations,potion,hp,iron,essence]"
            sprite: "enum:[wolf,spider,bandit,skeleton,troll,drake,ooze,wisp,warden,chasm,rocks,thorns,stranger,chest,cart,shrine,campfire]"
            tint: "enum:[none,red,green,blue,gold,shadow,pale,purple]"
            time: "enum:[day,dusk,night]"
            weather: "enum:[clear,rain,snow,fog,embers,fireflies,leaves]"
          then:
            - call: apply_ai
              params:
                title: out.title
                text: out.text
                foe: out.foe
                relic: out.relic
                sprite: out.sprite
                tint: out.tint
                time: out.time
                weather: out.weather
                o1_label: out.o1_label
                o1_verb: out.o1_verb
                o1_ability: out.o1_ability
                o1_diff: out.o1_diff
                o1_reward: out.o1_reward
                o1_risk: out.o1_risk
                o1_cost: out.o1_cost
                o2_label: out.o2_label
                o2_verb: out.o2_verb
                o2_ability: out.o2_ability
                o2_diff: out.o2_diff
                o2_reward: out.o2_reward
                o2_risk: out.o2_risk
                o2_cost: out.o2_cost
                o3_label: out.o3_label
                o3_verb: out.o3_verb
                o3_ability: out.o3_ability
                o3_diff: out.o3_diff
                o3_reward: out.o3_reward
                o3_risk: out.o3_risk
                o3_cost: out.o3_cost
      context:
        state: [distance, biome, event_kind, event_tier, threat, level, hp, max_hp, abil, rations, potions, gold, iron, essence, gear, relics, status, quest, art]
        history_turns: 10
        setting: false
      temperature: 1.0
    epitaph:
      kind: narrate
      trigger: game_end
      after_end: true
      optional: true
      prompt: |
        冒险者倒下了。一共走了 {{state.distance}} 里，到达 {{state.level}} 级，击败了 {{state.kills}} 个敌人，带着遗物 {{state.relics}}，最后倒在了 {{state.biome}}。
        请写一段简短的墓志铭式的结语（2~3 句），回顾这段旅程，语气庄重但带一点温暖。
      card:
        task: 为倒下的冒险者写一段简短的旅程结语。
        authority: 0
        output:
          format: text
          to: component:log
          max_chars: 300
      context:
        state: [distance, level, kills, biome, relics]
        history_turns: 0
        setting: false
      fallback: { zh: 路还在，传说也还在。, en: "The road remains, and so does the legend." }
  images:
    vista:
      trigger: event:milestone
      prompt: 一条古老的道路穿过奇幻世界中的地区（{{state.biome}}），远处是地平线，冒险者的背影很小。
      style: painterly fantasy landscape, wide shot, warm light, no text
      size: 1536x1024
      cache: { by_state: [biome] }
      fallback: asset:vista
      alt: { zh: AI 绘制的远方风景, en: An AI-painted view ahead }

ui:
  theme:
    base: dark
    colors: { accent: "#e0a84a", bg: "#16130f", text: "#efe6d6", panel: "#221d17" }
    font: { body: serif, size: 16 }
  layout:
    template: two-column
  components:
    stage:
      type: canvas
      region: main
      width: 256
      height: 144
      pixelated: true
      render: scripts/scene.js#draw
    log:
      type: text-log
      region: main
      content: ai
    now:
      type: text-block
      region: side
      label: { zh: 眼前, en: Right now }
      bind: situation
    vitals:
      type: stat-list
      region: side
      label: { zh: 冒险者, en: Adventurer }
      bind: [hp, max_hp, level, xp, xp_next, ac]
    pack:
      type: text-block
      region: side
      label: { zh: 行囊, en: Pack }
      bind: pack_text
    upgrades:
      type: text-block
      region: side
      label: { zh: 强化, en: Upgrades }
      bind: gear_text
    relic_block:
      type: text-block
      region: side
      label: { zh: 遗物, en: Relics }
      bind: relic_text
    status_block:
      type: text-block
      region: side
      label: { zh: 状态, en: Status }
      bind: status_text
    record:
      type: stat-list
      region: side
      label: { zh: 旅程, en: Journey }
      bind: [distance, best, kills]
    abil_block:
      type: text-block
      region: side
      label: { zh: 属性, en: Abilities }
      bind: abilities
    vista_img:
      type: image
      region: side
      label: { zh: 远方, en: Ahead }
      generated: vista
      fit: cover
      player_can_hide: true
    road:
      type: choice-buttons
      region: input
      choices:
        - { label: { zh: 继续前进, en: Walk on }, action: walk }
        - { label: { zh: 扎营休息, en: Camp }, action: camp }
        - { label: { zh: 喝药水, en: Potion }, action: potion }
        - { label: { zh: 攻击, en: Attack }, action: attack }
        - { label: { zh: 逃跑, en: Flee }, action: flee }
