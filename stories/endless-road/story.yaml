  # 精灵（像素画，自动描边）：主角 6 帧（站立、走路 4 帧、攻击），篝火 2 帧，其余 1 帧
  hero_fighter: { type: image, path: assets/sprites/hero_fighter.png, use: other }
  hero_rogue: { type: image, path: assets/sprites/hero_rogue.png, use: other }
  hero_wizard: { type: image, path: assets/sprites/hero_wizard.png, use: other }
  hero_cleric: { type: image, path: assets/sprites/hero_cleric.png, use: other }
