spec: oasis/0.4
meta:
  id: endless-road
  title: { zh: 无尽之路, en: The Endless Road }
  version: 1.0.0
  summary:
    zh: 一条没有尽头的路，一路上的怪物、陷阱、行商与奇遇都由 AI 现场生成（需要接入 AI）。简化版 D&D 规则，管好资源、强化装备，看你能走多远。
    en: An endless road where AI invents every monster, trap and wonder (AI required). Light D&D rules — manage supplies, upgrade gear, see how far you get.
  languages: [zh, en]
  ai_role:
    zh: AI 把引擎掷出的每个路上事件写成一张事件卡（名字、描述、2~3 个有取舍的选项），并挑选画面模块；数值由规则计算。
    en: The AI writes each road event as a card (name, scene, 2–3 options) and picks its visuals; the rules handle all numbers.
  est_tokens_per_min: 5000
  platforms: [desktop]   # 手机端暂不支持：当前客户端在手机上会把各区域压进一屏，内容多的面板会重叠
  description:
    zh: |
      2D 像素横版冒险。你从老旅店出发，一路向东。每走一里吃掉 1 份口粮，并遇到一个由 AI 现场写成的事件：怪物、断桥、行商、古老的祭坛、两难的抉择……每次冒险都不一样。

      - 每个事件是一张卡，选项上写明了难度、成功的收获和失败的风险。
      - 简化版 D&D 规则：属性检定、d20 战斗、升级、额外攻击。每 25 里有一个守关者。
      - 管好口粮、药水和金币；收集铁料和魔晶，在行商那里强化武器、护甲、背包和营具。
      - 最多带 3 件遗物；接下委托，几里后回来领取丰厚报酬。

      每张事件卡都由 AI 写成，平均每走一里调用一次。
    en: |
      A 2D pixel side-scroller. You leave the old inn and head east. Every mile costs a ration and brings an event written live by the AI: monsters, broken bridges, peddlers, ancient shrines, hard choices… no two runs are alike.

      - Every event is a card; each option shows its difficulty, reward and risk.
      - Light D&D rules: ability checks, d20 combat, levels, Extra Attack. A warden guards every 25 miles.
      - Manage rations, potions and gold; gather iron and essence to upgrade weapon, armor, pack and camp kit at peddlers.
      - Carry up to 3 relics; accept errands and come back a few miles later for big rewards.

      The AI writes every event card — about one call per mile walked.
  rating: all-ages
  tags:
    - { zh: 地下城与勇士规则, en: D&D rules }
    - { zh: 无尽生存, en: Survival }
    - { zh: AI生成事件, en: AI events }
  authors: [muoushikoma]
  cover: assets/cover.png
  est_minutes: 30
  license: All rights reserved by the author; distributed under stories/LICENSE.md

assets:
  cover: { type: image, path: assets/cover.png, use: illustration, alt: { zh: 通往远方的路, en: A road to the horizon } }
  # 背景：每个地区 4 层（天空 / 远景 / 中景 / 地面与路），画面里按不同速度视差卷动
  plains_sky: { type: image, path: assets/bg/plains_sky.png, use: background }
  plains_far: { type: image, path: assets/bg/plains_far.png, use: background }
  plains_mid: { type: image, path: assets/bg/plains_mid.png, use: background }
  plains_ground: { type: image, path: assets/bg/plains_ground.png, use: background }
  forest_sky: { type: image, path: assets/bg/forest_sky.png, use: background }
  forest_far: { type: image, path: assets/bg/forest_far.png, use: background }
  forest_mid: { type: image, path: assets/bg/forest_mid.png, use: background }
  forest_ground: { type: image, path: assets/bg/forest_ground.png, use: background }
  hills_sky: { type: image, path: assets/bg/hills_sky.png, use: background }
  hills_far: { type: image, path: assets/bg/hills_far.png, use: background }
  hills_mid: { type: image, path: assets/bg/hills_mid.png, use: background }
  hills_ground: { type: image, path: assets/bg/hills_ground.png, use: background }
  swamp_sky: { type: image, path: assets/bg/swamp_sky.png, use: background }
