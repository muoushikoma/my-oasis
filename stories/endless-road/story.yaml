spec: oasis/0.4
meta:
  id: endless-road
  title: { zh: 无尽之路, en: The Endless Road }
  version: 1.0.0
  summary:
    zh: 一条没有尽头的路，一路上的怪物、陷阱、行商与奇遇都由 AI 现场生成（需要接入 AI）。简化版 D&D 规则，管好资源、强化装备，看你能走多远。
    en: An endless road where AI invents every monster, trap and wonder (AI required). Light D&D rules — manage supplies, upgrade gear, see how far you get.
  languages: [zh, en]
  ai_role:
    zh: AI 是这个世界的造物者：用机制语言设计新道具、怪物招式、地区异象和旅途感悟，并写下每个事件与旅途主线；规则执行机制，只负责配平强度。
    en: The AI designs new item mechanics, monster moves, regional omens and insights, and writes every event and the thread; rules run them and balance power.
  est_tokens_per_min: 7000
  platforms: [desktop, mobile]
  description:
    zh: |
      2D 像素横版冒险。你从老旅店出发，一路向东。每走一里吃掉 1 份口粮，并遇到一个由 AI 现场写成的事件：怪物、断桥、行商、古老的祭坛、两难的抉择……每次冒险都不一样。

      - 每个事件是一张卡，选项上写明了难度、成功的收获和失败的风险。
      - 回合制战斗：敌人会预告下一步（攻击、蓄力重击、防御、下毒、偷钱……），你用攻击、防御和职业技能应对。每 25 里有一个守关者。
      - 四个职业各有一种资源和 3 个技能；升级时三选一天赋。
      - 每 5 里一个岔路口：安全的大路、富饶的荒野、或一步两里的捷径。疲劳会累积，扎营才能清除。
      - 管好口粮、药水和金币；收集铁料和魔晶，在行商那里强化武器、护甲、背包和营具。
      - 最多带 3 件遗物；接下委托，几里后回来领取丰厚报酬。

      AI 是这个世界的造物者：每一局它都会像游戏设计师一样设计新东西——带条件、连锁、代价和成长的道具，有专属招式和被动的怪物，改变一片土地规则的地区异象，以及升级时的“旅途感悟”。规则读懂这些机制并执行，只负责把总强度配平。见过的造物会记进跨局的图鉴。

      每张事件卡都由 AI 写成，平均每走一里调用一次，另外每几里发明一批新东西。
    en: |
      A 2D pixel side-scroller. You leave the old inn and head east. Every mile costs a ration and brings an event written live by the AI: monsters, broken bridges, peddlers, ancient shrines, hard choices… no two runs are alike.

      - Every event is a card; each option shows its difficulty, reward and risk.
      - Turn-based combat: foes telegraph their next move (attack, charge, guard, poison, steal…); answer with attacks, guard and class skills. A warden guards every 25 miles.
      - Four classes, each with its own resource and 3 skills; pick a talent each level.
      - A fork every 5 miles: the safe highway, the rich wilds or a two-mile shortcut. Fatigue builds until you camp.
      - Manage rations, potions and gold; gather iron and essence to upgrade weapon, armor, pack and camp kit at peddlers.
      - Carry up to 3 relics; accept errands and come back a few miles later for big rewards.

      The AI is this world's maker: every run it designs new things like a game designer — items with conditions, chains, costs and growth; monsters with their own moves and passives; omens that rewrite a region's rules; and level-up insights. The rules run these mechanics and only balance their overall power. Everything you meet goes into a codex that lasts across runs.

      The AI writes every event card — about one call per mile walked — plus a batch of new inventions every few miles.
  rating: all-ages
  tags:
    - { zh: 地下城与勇士规则, en: D&D rules }
    - { zh: 无尽生存, en: Survival }
    - { zh: AI生成事件, en: AI events }
  authors: [muoushikoma]
  cover: assets/cover.png
  est_minutes: 30
  license: All rights reserved by the author; distributed under stories/LICENSE.md

assets:
  cover: { type: image, path: assets/cover.png, use: illustration, alt: { zh: 通往远方的路, en: A road to the horizon } }
  # 背景：每个地区 4 层（天空 / 远景 / 中景 / 地面与路），画面里按不同速度视差卷动
  plains_sky: { type: image, path: assets/bg/plains_sky.png, use: background }
  plains_far: { type: image, path: assets/bg/plains_far.png, use: background }
  plains_mid: { type: image, path: assets/bg/plains_mid.png, use: background }
  plains_ground: { type: image, path: assets/bg/plains_ground.png, use: background }
  forest_sky: { type: image, path: assets/bg/forest_sky.png, use: background }
  forest_far: { type: image, path: assets/bg/forest_far.png, use: background }
  forest_mid: { type: image, path: assets/bg/forest_mid.png, use: background }
  forest_ground: { type: image, path: assets/bg/forest_ground.png, use: background }
  hills_sky: { type: image, path: assets/bg/hills_sky.png, use: background }
  hills_far: { type: image, path: assets/bg/hills_far.png, use: background }
  hills_mid: { type: image, path: assets/bg/hills_mid.png, use: background }
  hills_ground: { type: image, path: assets/bg/hills_ground.png, use: background }
  swamp_sky: { type: image, path: assets/bg/swamp_sky.png, use: background }
  swamp_far: { type: image, path: assets/bg/swamp_far.png, use: background }
  swamp_mid: { type: image, path: assets/bg/swamp_mid.png, use: background }
  swamp_ground: { type: image, path: assets/bg/swamp_ground.png, use: background }
  mountains_sky: { type: image, path: assets/bg/mountains_sky.png, use: background }
  mountains_far: { type: image, path: assets/bg/mountains_far.png, use: background }
  mountains_mid: { type: image, path: assets/bg/mountains_mid.png, use: background }
  mountains_ground: { type: image, path: assets/bg/mountains_ground.png, use: background }
  ashlands_sky: { type: image, path: assets/bg/ashlands_sky.png, use: background }
  ashlands_far: { type: image, path: assets/bg/ashlands_far.png, use: background }
  ashlands_mid: { type: image, path: assets/bg/ashlands_mid.png, use: background }
