    epitaph:
      kind: narrate
      trigger: game_end
      after_end: true
      optional: true
      prompt: |
        冒险者倒下了。一共走了 {{state.distance}} 里，到达 {{state.level}} 级，击败了 {{state.kills}} 个敌人，带着遗物 {{state.relics}}，最后倒在了 {{state.biome}}。
        请写一段简短的墓志铭式的结语（2~3 句），回顾这段旅程，语气庄重但带一点温暖。
      card:
        task: 为倒下的冒险者写一段简短的旅程结语。
        authority: 0
        output:
          format: text
          to: component:log
          max_chars: 300
      context:
        state: [distance, level, kills, biome, relics]
        history_turns: 0
        setting: false
      fallback: { zh: 路还在，传说也还在。, en: "The road remains, and so does the legend." }

ui:
  theme:
    base: dark
    colors: { accent: "#e0a84a", bg: "#16130f", text: "#efe6d6", panel: "#221d17" }
    font: { body: serif, size: 16 }
  layout:
    template: custom
    grid: ["stage side", "log side"]
    columns: ["minmax(0, 3fr)", "minmax(340px, 2fr)"]
    rows: ["auto", "minmax(240px, 1fr)"]
  components:
    stage:
      type: canvas
      region: stage
      width: 256
      height: 144
      pixelated: true
      render: scripts/scene.js#draw
    # 两个自定义面板共用 ui/panel.html，用 config.view 区分；角色等详情是点按钮弹出的浮动面板（api.overlay）
    action_bar:
      type: custom
      region: side
      src: ui/panel.html
      config: { view: bar }
      actions: [walk, camp, potion, attack, flee, open_panel]
      height: 96
      player_can_hide: false
      fallback: { zh: 行动栏是故事自带的自定义组件，请在设置里打开“自定义组件”后游玩。, en: "The action bar is a custom component — please turn custom components on in Settings to play." }
    event_panel:
      type: custom
      region: side
      src: ui/panel.html
      config: { view: event }
      actions: [choose, trade]
      height: 260
      player_can_hide: false
      fallback: { zh: 事件面板是故事自带的自定义组件，请在设置里打开“自定义组件”后游玩。, en: "The event panel is a custom component — please turn custom components on in Settings to play." }
    log:
      type: text-log
      region: log
      content: ai
