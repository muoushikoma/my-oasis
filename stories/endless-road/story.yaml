state:
  hp:        { type: number, init: 14, min: 0, integer: true, label: { zh: 生命, en: HP } }
  max_hp:    { type: number, init: 14, min: 1, integer: true, label: { zh: 最大生命, en: Max HP } }
  level:     { type: number, init: 1, min: 1, integer: true, label: { zh: 等级, en: Level } }
  xp:        { type: number, init: 0, min: 0, integer: true, label: { zh: 经验, en: XP } }
  xp_next:   { type: number, init: 60, integer: true, label: { zh: 升级所需, en: XP to level } }
  ac:        { type: number, init: 12, integer: true, label: { zh: 护甲等级, en: Armor Class } }
  distance:  { type: number, init: 0, min: 0, integer: true, label: { zh: 已走里程, en: Miles walked } }
  best:      { type: number, init: 0, min: 0, integer: true, label: { zh: 最远纪录, en: Best record } }
  kills:     { type: number, init: 0, min: 0, integer: true, label: { zh: 击败敌人, en: Foes defeated } }
  # 资源
  rations:   { type: number, init: 5, min: 0, integer: true, visible: both, desc: 口粮，每里吃 1 份 }
  potions:   { type: number, init: 2, min: 0, integer: true, visible: both, desc: 治疗药水 }
  gold:      { type: number, init: 15, min: 0, integer: true, visible: both, desc: 金币 }
  iron:      { type: number, init: 0, min: 0, integer: true, visible: both, desc: 铁料（强化材料） }
  essence:   { type: number, init: 0, min: 0, integer: true, visible: both, desc: 魔晶（稀有强化材料） }
  gear:      { type: json, init: { weapon: 0, armor: 0, pack: 0, kit: 0 }, visible: both, desc: 强化等级：武器、护甲、背包、营具 }
  relics:    { type: json, init: [], visible: both, desc: 携带的遗物（最多 3 件） }
  status:    { type: json, init: {}, visible: both, desc: 状态效果及剩余里程 }
  quest:     { type: json, init: {}, visible: both, desc: 进行中的委托（title 名字，due 回访的里程） }
  # 冒险者
  abil:      { type: json, init: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 }, visible: both, desc: 冒险者的六项属性值 }
  abilities: { type: string, init: "", visible: player, label: { zh: 属性, en: Abilities } }
  hero_class: { type: enum, values: [fighter, rogue, wizard, cleric], init: fighter, visible: both, desc: 冒险者的职业（战士 / 游荡者 / 法师 / 牧师） }
  class_name: { type: string, init: "", visible: player, label: { zh: 职业, en: Class } }
  class_info: { type: json, init: [], visible: player, desc: 选职业时显示的职业卡 }
  rolls:     { type: json, init: [], visible: none, desc: 开局掷出的 6 个属性值 }
  res:       { type: json, init: {}, visible: both, desc: 职业资源（k 种类 rage 怒气 / combo 连击 / mana 法力 / faith 信仰，cur 当前，max 上限），用来放技能 }
  perks:     { type: json, init: [], visible: both, desc: 升级时选的天赋 }
  perk_offer: { type: json, init: [], visible: player, desc: 这次升级可选的三个天赋 }
  perk_queue: { type: number, init: 0, min: 0, integer: true, visible: none }
  fatigue:   { type: number, init: 0, min: 0, integer: true, visible: both, desc: 疲劳，每里 +1，扎营清零；6 起 d20 -1，9 起 -2，12 起 -3 并且每里掉血 }
  path:
    type: enum
    values: [road, wilds, shortcut]
    init: road
    visible: both
    desc: 现在走的路：road 大路（安全）、wilds 荒野（危险但收获多）、shortcut 捷径（一步 2 里，很危险）
  fork_at:   { type: number, init: 5, integer: true, visible: none, desc: 下一个岔路口的里程 }
  thread:    { type: string, init: "", max_length: 120, visible: both, writable_by: [rules], desc: 旅途主线（AI 写，一句话，随旅程推进） }
  hero_block: { type: number, init: 0, min: 0, integer: true, visible: player, desc: 战斗中的格挡 }
  evade:     { type: bool, init: false, visible: player }
  ui_battle: { type: json, init: {}, visible: player, desc: 战斗面板要显示的内容（敌人意图、技能） }
  perk_text: { type: string, init: "", visible: player, label: { zh: 天赋, en: Talents } }
  # AI 造物
  items:     { type: json, init: [], visible: both, desc: 携带的 AI 发明的道具（饰品最多 4 件、消耗品最多 4 件）和旅途感悟 }
  items_ui:  { type: json, init: [], visible: player, desc: 道具栏要显示的内容 }
  pool:      { type: json, init: { items: [], perks: [], foes: [], req: 0, born: 0 }, visible: none, desc: AI 提前发明好、还没用上的道具、感悟和怪物 }
  uid:       { type: number, init: 0, integer: true, visible: none }
  loot:      { type: json, init: {}, visible: player, desc: 栏位满了时等待取舍的新道具 }
  made:      { type: json, init: [], visible: player, desc: 本局遇到的 AI 造物（道具、感悟、怪物） }
  codex_n:   { type: number, init: 0, integer: true, visible: player, desc: 图鉴里一共记录了多少 AI 造物（跨局） }
  toast:     { type: json, init: {}, visible: player, desc: 获得新道具时的提示 }
  riposte:   { type: number, init: 0, integer: true, visible: none }
  buff:      { type: json, init: {}, visible: player, desc: 本场战斗里的临时加成 }
  defer:     { type: json, init: [], visible: none }
  omen:      { type: json, init: {}, visible: ai, desc: 当前地区的异象（AI 写的这片土地的法则） }
  omen_ui:   { type: json, init: {}, visible: player, desc: 地区异象的显示内容 }
  # 世界
  biome:
    type: enum
    values: [plains, forest, hills, swamp, mountains, ashlands]
    init: plains
    visible: both
    desc: 当前地区：plains 风语平原，forest 幽暗森林，hills 古冢丘陵，swamp 腐沼泽地，mountains 霜脊山道，ashlands 余烬荒原
  art:       { type: json, init: { time: day, weather: clear }, visible: ai, desc: 画面的时间与天气 }
  scene_fx:  { type: json, init: { scroll: 0, target: 0, prev: null, cur: null, fx: [], busy: false }, visible: player, desc: 画面动画状态（界面组件据此画场景） }
  # 事件
  phase:
    type: enum
    values: [class, none, card, battle, shop, perk, fork, loot]
    init: class
    visible: both
    desc: 当前阶段：class 选职业，none 赶路，card 事件卡，battle 战斗，shop 交易，perk 升级选天赋，fork 岔路口，loot 道具取舍
  event_kind:
    type: enum
    values: [none, combat, encounter, discovery, hazard, mystic, dilemma, trade, rest, quest]
    init: none
    visible: ai
    desc: 当前事件类别（由引擎掷骰决定）
  event_tier:
    type: enum
    values: [weak, normal, tough, elite, boss]
    init: normal
    visible: ai
    desc: 事件强度（由引擎掷骰决定）
  event_title: { type: string, init: "", max_length: 60, visible: ai, desc: 当前事件的名字 }
  threat:    { type: number, init: 1, integer: true, visible: ai, desc: 威胁等级，越大越危险 }
  card:      { type: json, init: {}, visible: none }
  foe:       { type: json, init: {}, visible: player, desc: 当前战斗的敌人（给面板显示血条） }
  next:      { type: json, init: {}, visible: none, desc: 提前掷好、正在或已经由 AI 写好的下一里事件 }
  camped:    { type: bool, init: false, visible: player }
  # 面板文字（规则生成）
  situation:   { type: string, init: "", visible: player, label: { zh: 眼前, en: Right now } }
  next_ready:  { type: bool, init: false, visible: player, desc: 下一里的事件卡是否已经由 AI 提前写好 }
  journal:     { type: json, init: [], visible: player, desc: 最近的冒险日志（界面里画日志框） }
  screen:      { type: json, init: { w: 0, h: 0 }, visible: player, desc: 窗口尺寸 }
  epitaph:     { type: string, init: "", max_length: 600, visible: player, writable_by: [rules, ai], desc: 倒下时 AI 写的结语 }
  ui_card:     { type: json, init: { mode: none }, visible: player, desc: 事件卡/商店要显示的内容（给自定义组件 ui/panel.html） }
  pack_text:   { type: string, init: "", visible: player, label: { zh: 行囊, en: Pack } }
  gear_text:   { type: string, init: "", visible: player, label: { zh: 强化, en: Upgrades } }
  relic_text:  { type: string, init: "", visible: player, label: { zh: 遗物, en: Relics } }
  status_text: { type: string, init: "", visible: player, label: { zh: 状态, en: Status } }

realtime:
  tick_hz: 20
  tick_ms: 16
  interpolate: true
  on_tick: scripts/scene.js#tick
  on_ai: scripts/road.js#on_ai
  on_resize: scripts/road.js#on_resize
  timers:
    card_watch: { every_ms: 500, script: scripts/road.js#watch }

start:
  intro:
    zh: 老旅店的门在你身后关上。门前那条路向东延伸，没人知道它通向哪里——据说从没有人走到过尽头。你紧了紧背包，迈出了第一步。
    en: The old inn's door shuts behind you. The road outside runs east, and no one knows where it leads — they say no one has ever reached its end. You tighten your pack and take the first step.
  do:
    - call: setup

actions:
  setup:
    callable_by: [rules]
    script: scripts/road.js#setup
  pick_class:
    label: { zh: 选择职业, en: Choose class }
    params:
      id: { type: enum, values: [fighter, rogue, wizard, cleric] }
    require: "state.phase == 'class'"
    require_message: { zh: 职业已经选好了。, en: Your class is already chosen. }
    callable_by: [player]
    script: scripts/road.js#pick_class
  walk:
    label: { zh: 继续前进, en: Walk on }
    desc: { zh: 向前走一里，吃掉 1 份口粮，并遇到新的事件, en: "Walk one mile, eat 1 ration, and meet a new event" }
    require: "state.phase == 'none'"
    require_message: { zh: 先处理眼前的事件。, en: Deal with the current event first. }
    callable_by: [player]
    steps:
      - call: walk_rules
      - if: "state.distance % 10 == 0"
        then: [ { emit: milestone } ]
  walk_rules:
    callable_by: [rules]
    script: scripts/road.js#walk_rules
  attack:
    label: { zh: 攻击, en: Attack }
    require: "state.phase == 'battle'"
    require_message: { zh: 现在没有在战斗。, en: You are not in a fight. }
    callable_by: [player]
    script: scripts/road.js#attack
  defend:
    label: { zh: 防御, en: Defend }
    require: "state.phase == 'battle'"
    require_message: { zh: 现在没有在战斗。, en: You are not in a fight. }
    callable_by: [player]
    script: scripts/road.js#defend
  skill:
    label: { zh: 技能, en: Skill }
    params:
      id: { type: string }
    require: "state.phase == 'battle'"
    require_message: { zh: 现在没有在战斗。, en: You are not in a fight. }
    callable_by: [player]
    script: scripts/road.js#skill
  pick_perk:
    label: { zh: 选择天赋, en: Choose talent }
    params:
      id: { type: string }
    require: "state.phase == 'perk'"
    require_message: { zh: 现在没有可选的天赋。, en: There is no talent to choose. }
    callable_by: [player]
    script: scripts/road.js#pick_perk
  go:
    label: { zh: 选择道路, en: Choose path }
    params:
      id: { type: enum, values: [road, wilds, shortcut] }
    require: "state.phase == 'fork'"
    require_message: { zh: 现在不在岔路口。, en: You are not at a fork. }
    callable_by: [player]
    script: scripts/road.js#go
  use_item:
    label: { zh: 使用道具, en: Use item }
    params:
      id: { type: string }
    require: "state.phase == 'battle' || state.phase == 'none' || state.phase == 'card'"
    require_message: { zh: 现在不能使用道具。, en: You can't use items right now. }
    callable_by: [player]
    script: scripts/road.js#use_item
  drop_item:
    label: { zh: 道具取舍, en: Choose item }
    params:
      id: { type: string }
    require: "state.phase == 'loot'"
    require_message: { zh: 没有要取舍的道具。, en: Nothing to choose. }
    callable_by: [player]
    script: scripts/road.js#drop_item
  flee:
    label: { zh: 逃跑, en: Flee }
    require: "state.phase == 'battle'"
    require_message: { zh: 现在没有在战斗。, en: You are not in a fight. }
    callable_by: [player]
    script: scripts/road.js#flee
  potion:
    label: { zh: 喝药水, en: Drink potion }
    require: "state.potions > 0 && state.hp < state.max_hp"
    require_message: { zh: 没有药水，或者生命已满。, en: "No potions, or you are at full HP." }
    callable_by: [player]
    script: scripts/road.js#potion
  camp:
    label: { zh: 扎营休息, en: Make camp }
    require: "state.phase == 'none' && !state.camped && state.rations > 0"
    require_message: { zh: 现在不能扎营（每里只能扎营一次，需要 1 份口粮，且附近不能有事件）。, en: "You can't camp now (once per mile, costs 1 ration, and nothing else going on)." }
    callable_by: [player]
    script: scripts/road.js#camp_rules
  choose:
    label: { zh: 选择, en: Choose }
    desc: { zh: 在事件卡上选择一个选项, en: Pick an option on the event card }
    params:
      id: { type: string }
    require: "state.phase == 'card'"
    require_message: { zh: 现在没有事件卡。, en: There is no event card right now. }
    callable_by: [player]
    script: scripts/road.js#choose
  trade:
    label: { zh: 交易, en: Trade }
    desc: { zh: 在行商处购买或强化, en: Buy or upgrade at the peddler }
    params:
      id: { type: string }
    require: "state.phase == 'shop'"
    require_message: { zh: 附近没有行商。, en: There is no peddler here. }
    callable_by: [player]
    script: scripts/road.js#trade

endings:
  list:
    - id: fallen
      label: { zh: 倒在路上, en: Fallen on the road }
      kind: bad
      when: "state.hp <= 0"
      text:
        zh: 你倒在了路边。风吹过，路依旧向前延伸。看看你走了多远——下一次，也许能走得更远。
        en: You collapse by the roadside. The wind blows on, and the road still runs ahead. See how far you came — next time, perhaps further.


ai:
  model_hint: { tier: standard, note: 每走一里写一张事件卡（JSON），中等模型效果最好 }
  system: |
    这是一个低魔奇幻世界（类似 D&D 的经典奇幻）。一位冒险者沿着一条没有尽头的路向东走。
    风格：简洁、有画面感、偶尔带一点幽默。适合所有年龄：可以有战斗和危险，但不写血腥细节。
    每次冒险都应该是全新的：多用意想不到的生物、人物、地点和两难选择，不要重复之前出现过的东西。
  rules:
    max_authority: 0
    must:
      - 事件的类别和强度已经由引擎掷骰决定，你负责把它写成一张具体、生动的事件卡
      - 选项的收获和风险只能从给定的菜单里挑，具体数值由规则计算
    forbid:
      - 写出具体的数值、伤害或骰子结果
      - 替玩家做决定或写出事件的结果
      - 血腥、恐怖猎奇或不适合全年龄的内容
  entry_points:
    road_event:
      kind: generate
      trigger: script
      prompt: |
        要写的是第 {{event.mile}} 里的事件（冒险者现在在第 {{state.distance}} 里，这张卡可能是提前写好的），地区：{{event.biome}}。
        引擎掷出的事件类别：{{event.kind}}，强度：{{event.tier}}，威胁等级：{{event.threat}}。
        走的路：{{event.path}}（大路安全、荒野危险但收获多、捷径最危险）。
        旅途主线（你之前写的，一句话）：{{event.thread}}
        冒险者：{{event.hero}}，天赋 {{event.perks}}，疲劳 {{state.fatigue}}，{{state.level}} 级，生命 {{state.hp}}/{{state.max_hp}}，属性 {{state.abil}}；口粮 {{state.rations}}，药水 {{state.potions}}，金币 {{state.gold}}，铁料 {{state.iron}}，魔晶 {{state.essence}}；遗物 {{state.relics}}；状态 {{state.status}}；委托 {{state.quest}}。

        请把这个事件写成一张事件卡：
        - title：事件名（不超过 12 个字）。text：2~3 句描述，停在需要做决定的地方。
        - foe：combat 时是敌人的名字（守关者要有气势的名号）；其他类别里如果有可能打起来的对象，写它的名字，否则留空。
        - 写 2~3 个选项（o1_ / o2_ / o3_），每个选项：
          - label：玩家要做的事（不超过 10 个字，如“攀过断桥”“说服守卫”“献上金币”）。
          - verb：check 属性检定 / pay 付出代价换确定收获 / gamble 赌运气 / fight 动手 / quest 接受委托（几里后回访，奖励丰厚）；不用的选项填 none。
          - ability（check 用）：str 力量、dex 敏捷、con 体质、int 智力、wis 感知、cha 魅力。diff（check 用）：easy / normal / hard，越难收获越大。
          - reward：成功时的收获 gold 金币 / rations 口粮 / potion 药水 / heal 恢复 / iron 铁料 / essence 魔晶 / xp 经验 / blessing 祝福 / relic 遗物（只有 hard 检定和委托回访才给）/ map 侦察 / none。
          - risk（check、gamble 用）：失败时 hurt 受伤 / lose_gold / lose_rations / curse 诅咒 / poison 中毒 / ambush 被袭击（转入战斗）/ lost 迷路 / exhaust 疲惫 / none。
          - cost（pay 用）：gold / rations / potion / hp / iron / essence。
          - win / lose：这个选项成功 / 失败时发生了什么，各一句话（不超过 40 字，不写数值）。玩家选了之后才会看到，要写得具体、有画面，让结果像故事而不只是数字。fight 只写 win（冲上去那一刻）。
        - 敌人（combat 或可能打起来时）：foe_trait 从 armored 重甲 / swift 迅捷 / venomous 剧毒 / brute 蛮力 / regenerating 再生 / arcane 奥术 / undead 亡灵 / thief 盗贼 里挑最贴切的（规则会让它按这个特性出招）；foe_line 是它开打时说的一句话或发出的动静（有个性）；foe_end 是它被打败时的一句描写。
        - thread：旅途主线，一句话（不超过 40 字）。它把一路上的事件串成一个故事：比如有人在追你、一个预言、一件被诅咒的遗物、远方的某座城。延续上面已有的主线并推进一点（可以在这张卡里埋下线索、让旧角色回来）；如果还没有，就开启一条。
        - 各类别的写法：
          - combat：遭遇一个敌人，至少一个 fight 选项，另外可以有偷偷绕过（check）、贿赂（pay）等。
          - encounter：遇到会说话的人或生物，可以交易、帮忙、接委托，也可能翻脸。
          - discovery：废墟、遗物、尸骸、宝箱。hazard：环境险阻（桥、风暴、流沙、落石）。
          - mystic：祭坛、精灵、诅咒之物、许愿泉。dilemma：两难的道德选择，让每个选项都有代价。
          - quest：委托「{{event.quest}}」的结局，要呼应委托的名字，奖励可以给 relic。
          - trade：写一位有特点的行商（选项留空，规则会打开商店）。rest：写一处安全的歇脚地（选项留空）。
        - 根据冒险者的处境出难题：口粮少就让食物成为诱惑，疲劳高就让休息变得昂贵，生命低就给出用生命换收获的危险选项。
        - 选项要有不同的取舍：比如一个稳妥但收获小，一个冒险但收获大，一个花资源换确定结果。结合冒险者的职业（战士擅长力量/体质、游荡者擅长敏捷、法师擅长智力、牧师擅长感知）和当前缺什么来设计。
        - 这一里的 AI 造物（之前由你发明、规则已经收下的，请自然地写进这张卡）：
          - 道具：{{event.item}}。如果有，让它出现在场景里，并让至少一个选项的 reward 是 relic（得到这件道具）。
          - 怪物：{{event.sig}}。如果有，这就是 combat 里的敌人：描述它的样子，foe 填它的名字，foe_line 写它的台词。
          - 行商的独特货品：{{event.wares}}。trade 时可以在描述里提到它们。
          - 冒险者现在带着的道具：{{event.inv}}——可以让它们在故事里产生呼应。
        - relic（可选，只在没有 AI 道具时用）：如果有选项给 relic，挑一件：lucky_charm 幸运符、vampiric_blade 吸血之刃、traveler_boots 旅人靴、guardian_amulet 守护护符、hunter_horn 猎人号角、alchemist_flask 炼金瓶、star_chart 星图、undying_ember 不灭余烬。

        画面由模块拼成，请挑最贴切的组合：
        - sprite：combat 从 wolf 野兽、spider 虫、bandit 人形、skeleton 亡灵、troll 大块头、drake 飞龙、ooze 软泥、wisp 元素/幽魂 里选（守关者还可选 warden）；encounter/dilemma/quest 选 stranger、bandit、skeleton、wisp；discovery 选 chest、rocks、shrine；hazard 选 chasm、rocks、thorns；mystic 选 shrine、wisp；trade 选 cart；rest 选 campfire。
        - tint：none / red / green / blue / gold / shadow / pale / purple。time：day / dusk / night。weather：clear / rain / snow / fog / embers / fireflies / leaves，要符合地区。
      card:
        task: 把引擎刚刚掷出的路上事件写成一张事件卡：名字、描述、2~3 个有取舍的选项，以及画面模块。
        authority: 0
        output:
          format: json
          to: none
          max_chars: 3000
          schema:
            title: string
            text: string
            foe: string
            relic: "enum:[none,lucky_charm,vampiric_blade,traveler_boots,guardian_amulet,hunter_horn,alchemist_flask,star_chart,undying_ember]"
            o1_label: string
            o1_verb: "enum:[none,check,pay,gamble,fight,quest]"
            o1_ability: "enum:[wis,str,dex,con,int,cha]"
            o1_diff: "enum:[normal,easy,hard]"
            o1_reward: "enum:[none,gold,rations,potion,heal,iron,essence,xp,blessing,relic,map]"
            o1_risk: "enum:[hurt,lose_gold,lose_rations,curse,poison,ambush,lost,exhaust,none]"
            o1_cost: "enum:[gold,rations,potion,hp,iron,essence]"
            o1_win: string
            o1_lose: string
            o2_label: string
            o2_verb: "enum:[none,check,pay,gamble,fight,quest]"
            o2_ability: "enum:[wis,str,dex,con,int,cha]"
            o2_diff: "enum:[normal,easy,hard]"
            o2_reward: "enum:[none,gold,rations,potion,heal,iron,essence,xp,blessing,relic,map]"
            o2_risk: "enum:[hurt,lose_gold,lose_rations,curse,poison,ambush,lost,exhaust,none]"
            o2_cost: "enum:[gold,rations,potion,hp,iron,essence]"
            o2_win: string
            o2_lose: string
            o3_label: string
            o3_verb: "enum:[none,check,pay,gamble,fight,quest]"
            o3_ability: "enum:[wis,str,dex,con,int,cha]"
            o3_diff: "enum:[normal,easy,hard]"
            o3_reward: "enum:[none,gold,rations,potion,heal,iron,essence,xp,blessing,relic,map]"
            o3_risk: "enum:[hurt,lose_gold,lose_rations,curse,poison,ambush,lost,exhaust,none]"
            o3_cost: "enum:[gold,rations,potion,hp,iron,essence]"
            o3_win: string
            o3_lose: string
            foe_trait: "enum:[none,armored,swift,venomous,brute,regenerating,arcane,undead,thief]"
            foe_line: string
            foe_end: string
            thread: string
            sprite: "enum:[wolf,spider,bandit,skeleton,troll,drake,ooze,wisp,warden,chasm,rocks,thorns,stranger,chest,cart,shrine,campfire]"
            tint: "enum:[none,red,green,blue,gold,shadow,pale,purple]"
            time: "enum:[day,dusk,night]"
            weather: "enum:[clear,rain,snow,fog,embers,fireflies,leaves]"
      context:
        state: [distance, hero_class, level, hp, max_hp, abil, rations, potions, gold, iron, essence, gear, relics, status, quest, art, fatigue, path, thread, perks]
        history_turns: 6
        setting: false
      temperature: 1.0
    invent:
      kind: generate
      trigger: script
      prompt: |
        你是这个世界的造物者。为这次冒险设计全新的道具、能力、怪物和地区法则——不是从清单里挑，而是像游戏设计师一样设计机制。
        规则会读懂你写的机制并执行；具体数值由规则按“这个设计有多强”自动配平：条件越苛刻、触发越少、代价越重，效果就越猛。所以大胆设计，不用担心数字。
        当前：第 {{event.mile}} 里，{{event.biome}}（下一片地区：{{event.next_biome}}），走在{{event.path}}上。
        冒险者：{{event.hero}}，{{event.level}} 级，技能 {{event.skills}}，处境：{{event.need}}，带着：{{event.inv}}。
        旅途主线：{{event.thread}}
        本局已经设计过：{{event.made}}（不要重复）。以前的冒险里出现过：{{event.codex}}（尽量别重复）。

        ## 机制语言
        一条规则 = {"when": 时机, "if": 条件（可选）, "every": N（可选，每第 N 次才触发）, "chance": 百分比（可选）, "do": [效果, ...]}
        效果 = {"act": 效果名, "n": 1~5（相对强弱，同一条规则里多个效果之间的比重）}
        - 时机 when：passive 常驻 / battle_start 战斗开始 / turn_start 每回合开始 / on_attack 每次出手 / on_hit 命中 / on_crit 暴击 / on_miss 落空 / on_hurt 受伤 / on_block 完全挡住攻击 / low_hp 每场第一次跌破 30% 生命 / on_kill 击败敌人 / on_skill 使用技能 / on_potion 喝药水 / on_mile 每走一里 / on_camp 扎营 / on_level 升级 / use 消耗品被使用
        - 条件 if：{"k": "hp_below", "v": 50} / hp_above / foe_trait（v 填 armored swift venomous brute regenerating arcane undead thief）/ foe_boss / biome（v 填 plains forest hills swamp mountains ashlands）/ night / no_rations / gold_above / fatigue_above / first_turn / foe_charging 敌人蓄力时 / has_block / foe_poisoned
        - 效果 act：heal 回血 / block 格挡 / damage 伤害敌人 / damage_pct 按敌人最大生命比例伤害 / poison 毒敌人 / stun 眩晕敌人 / weaken 本场削弱敌人伤害 / expose 本场降低敌人护甲 / resource 职业资源 / gold / ration 口粮 / potion 药水 / xp / fatigue 减疲劳 / cleanse 解毒解咒 / bless 祝福 / luck_fight 本场 d20 加成 / ac_fight 本场护甲 / extra_attack 立刻再攻击一次 / double_next 下一击翻倍 / reflect 反弹下一次伤害
          常驻效果（只能 passive）：ac / luck / maxhp / res_max
          代价（只放在 flaws 里）：self_hurt 自伤 / lose_gold / hunger 多吃口粮 / tire 加疲劳 / foe_heal 敌人回血 / curse_self 诅咒自己 / frail 最大生命降低（passive）
        - 成长 grow（可选）：{"on": 时机, "need": 3~15, "name": "觉醒后的名字", "desc": "觉醒后的描写"}——达到次数后觉醒，变得更强。

        ## 要设计的东西（只输出一个 JSON 对象，不要别的文字）
        {
          "items": [三件道具，每件 {"name": 不超过 8 个字, "desc": 一句来历或用法（不写数字）, "kind": "trinket" 随身饰品 或 "consumable" 消耗品, "rules": [1~3 条规则], "flaws": [0~2 条代价规则], "grow": 可选}],
          "insight": {一条旅途感悟：冒险者从这段经历里领悟的能力，"name", "desc"（呼应主线或之前的经历）, "rules": [1~2 条规则]},
          "foes": [两种这片地区特有的新怪物，每种 {"name", "desc": 一句外貌, "sprite": wolf/spider/bandit/skeleton/troll/drake/ooze/wisp 选最像的外形, "tint": none/red/green/blue/gold/shadow/pale/purple, "trait": 特性（同上，或 none）,
             "moves": [1~2 个招式 {"name": 不超过 6 个字, "hits": 1~3 段, "windup": 是否要先蓄力一回合（会被预告，更痛）, "unblockable": 是否无视格挡, "then": [0~2 个附带效果]}],
             "passive": 可选 {"when": battle_start/turn_end/on_hurt 被击中时/low_hp 生命低于 40% 时, "do": [1~2 个效果]},
             "line": 开打时的台词或动静, "end": 被打败时的描写}],
          "omen": {下一片地区（{{event.next_biome}}）的异象——这片土地的特殊法则，"name", "desc": 一句描写, "rules": [0~2 条对冒险者生效的规则], "flaws": [0~1 条代价], "foes": {"dmg": -2~3 敌人伤害变化, "hp": -30~60 敌人生命百分比变化}}
        }
        怪物的效果 act：poison / curse / weaken 削弱你的伤害 / expose 降低你的护甲 / steal 偷金币 / drain 吸血 / burn_rations 烧口粮 / tire 加疲劳 / drain_res 吸走职业资源 / heal_self / block_self / enrage 增伤 / harden 加护甲 / regen 持续再生；n 取 1~4。

        ## 设计要点
        - 机制要有想法、有取舍、彼此能配合：比如“每第 3 次命中时引爆毒素”“生命低于一半时每次出手都吸血”“击败亡灵 5 次后觉醒”“喝药水时反而充能”。
        - 名字、描写和机制要对得上；贴合地区、主线和冒险者的职业与技能，照顾他缺什么。
        - 三件道具里至少一件 consumable；至少一件带 flaws 或 grow。
        - 怪物的招式要有个性，并能被玩家读招应对（蓄力的大招、无视格挡的偷袭、越打越硬……）。
      card:
        task: 像游戏设计师一样，用机制语言为这次冒险设计新的道具、感悟、怪物和地区异象。
        authority: 0
        must:
          - 这次要输出的“文字”就是提示里描述的那一个 JSON 对象：从 { 开始到 } 结束，不要代码块，不要 JSON 以外的任何文字
        output:
          format: text
          to: none
          max_chars: 6000
      context:
        state: [distance, hero_class, level, hp, max_hp, rations, gold, relics, thread, biome]
        history_turns: 1
        setting: false
      temperature: 1.0
    epitaph:
      kind: generate
      trigger: game_end
      after_end: true
      optional: true
      prompt: |
        冒险者倒下了，身上带着这些道具：{{state.items}}。一共走了 {{state.distance}} 里，到达 {{state.level}} 级，击败了 {{state.kills}} 个敌人，带着遗物 {{state.relics}}，最后倒在了 {{state.biome}}。
        请写一段简短的墓志铭式的结语（2~3 句），回顾这段旅程，语气庄重但带一点温暖。
      card:
        task: 为倒下的冒险者写一段简短的旅程结语。
        authority: 0
        output:
          format: text
          to: state:epitaph
          max_chars: 300
      context:
        state: [distance, level, kills, biome, relics, items, thread]
        history_turns: 0
        setting: false
      fallback: { zh: 路还在，传说也还在。, en: "The road remains, and so does the legend." }

ui:
  theme:
    base: dark
    colors: { accent: "#e0a84a", bg: "#16130f", text: "#efe6d6", panel: "#221d17" }
    font: { body: serif, size: 16 }
  takeover: true
  layout:
    template: custom
    grid: ["screen"]
  components:
    # 整个游戏画面是一个自定义组件（ui/game.html）：组件里自己画像素场景，界面叠在场景上
    game:
      type: custom
      region: screen
      src: ui/game.html
      actions: [pick_class, walk, camp, potion, attack, defend, skill, flee, choose, trade, pick_perk, go, use_item, drop_item]
      height: 720
      player_can_hide: false
      fallback: { zh: 这个故事的整个游戏画面是自定义组件，请在设置里打开“自定义组件”后游玩。, en: "This story's whole game screen is a custom component — please turn custom components on in Settings to play." }
