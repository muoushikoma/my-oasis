spec: oasis/0.4
meta:
  id: endless-road
  title: { zh: 无尽之路, en: The Endless Road }
  version: 1.0.0
  summary:
    zh: 一条没有尽头的路，一路上的怪物、陷阱、行商与奇遇都由 AI 现场生成。简化版 D&D 规则，管好口粮、药水和金币，看你能走多远。
    en: A road with no end. Every monster, trap, peddler and wonder along it is generated live by AI. Light D&D rules — manage rations, potions and gold, and see how far you can go.
  language: zh-CN
  languages: [zh, en]
  rating: all-ages
  tags:
    - { zh: 地下城与勇士规则, en: D&D rules }
    - { zh: 无尽生存, en: Survival }
    - { zh: AI生成事件, en: AI events }
  authors: [muoushikoma]
  cover: assets/cover.png
  est_minutes: 30
  license: All rights reserved by the author; distributed under stories/LICENSE.md

assets:
  cover: { type: image, path: assets/cover.png, use: illustration, alt: { zh: 通往远方的路, en: A road to the horizon } }
  vista: { type: image, path: assets/vista.png, use: illustration, alt: { zh: 远方的风景, en: A distant view } }
  # 背景：每个地区 4 层（天空 / 远景 / 中景 / 地面与路），画面里按不同速度视差卷动
  plains_sky: { type: image, path: assets/bg/plains_sky.png, use: background }
  plains_far: { type: image, path: assets/bg/plains_far.png, use: background }
  plains_mid: { type: image, path: assets/bg/plains_mid.png, use: background }
  plains_ground: { type: image, path: assets/bg/plains_ground.png, use: background }
  forest_sky: { type: image, path: assets/bg/forest_sky.png, use: background }
  forest_far: { type: image, path: assets/bg/forest_far.png, use: background }
  forest_mid: { type: image, path: assets/bg/forest_mid.png, use: background }
  forest_ground: { type: image, path: assets/bg/forest_ground.png, use: background }
  hills_sky: { type: image, path: assets/bg/hills_sky.png, use: background }
  hills_far: { type: image, path: assets/bg/hills_far.png, use: background }
  hills_mid: { type: image, path: assets/bg/hills_mid.png, use: background }
  hills_ground: { type: image, path: assets/bg/hills_ground.png, use: background }
  swamp_sky: { type: image, path: assets/bg/swamp_sky.png, use: background }
  swamp_far: { type: image, path: assets/bg/swamp_far.png, use: background }
  swamp_mid: { type: image, path: assets/bg/swamp_mid.png, use: background }
  swamp_ground: { type: image, path: assets/bg/swamp_ground.png, use: background }
  mountains_sky: { type: image, path: assets/bg/mountains_sky.png, use: background }
  mountains_far: { type: image, path: assets/bg/mountains_far.png, use: background }
  mountains_mid: { type: image, path: assets/bg/mountains_mid.png, use: background }
  mountains_ground: { type: image, path: assets/bg/mountains_ground.png, use: background }
  ashlands_sky: { type: image, path: assets/bg/ashlands_sky.png, use: background }
  ashlands_far: { type: image, path: assets/bg/ashlands_far.png, use: background }
  ashlands_mid: { type: image, path: assets/bg/ashlands_mid.png, use: background }
  ashlands_ground: { type: image, path: assets/bg/ashlands_ground.png, use: background }
  # 精灵（像素画，自动描边）：主角 6 帧（站立、走路 4 帧、攻击），篝火 2 帧，其余 1 帧
  hero: { type: image, path: assets/sprites/hero.png, use: other }
  wolf: { type: image, path: assets/sprites/wolf.png, use: other }
  spider: { type: image, path: assets/sprites/spider.png, use: other }
  bandit: { type: image, path: assets/sprites/bandit.png, use: other }
  skeleton: { type: image, path: assets/sprites/skeleton.png, use: other }
  troll: { type: image, path: assets/sprites/troll.png, use: other }
  drake: { type: image, path: assets/sprites/drake.png, use: other }
  ooze: { type: image, path: assets/sprites/ooze.png, use: other }
  wisp: { type: image, path: assets/sprites/wisp.png, use: other }
  warden: { type: image, path: assets/sprites/warden.png, use: other }
  chest: { type: image, path: assets/sprites/chest.png, use: other }
  cart: { type: image, path: assets/sprites/cart.png, use: other }
  shrine: { type: image, path: assets/sprites/shrine.png, use: other }
  campfire: { type: image, path: assets/sprites/campfire.png, use: other }
